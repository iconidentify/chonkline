[package]
name = "irc-server"
version = "1.0.0"
edition = "2021"

[dependencies]
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[[test]]
name = "e2e"
path = "tests/e2e.rs"
