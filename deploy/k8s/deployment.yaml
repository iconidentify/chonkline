apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkline
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chonkline
          image: chonkline
          env:
            - name: IRC_PORT
              value: "6667"
            - name: IRC_SERVER_NAME
              value: "irc.chonkbase.net"
            # Registered accounts (SASL / NickServ) persist on the block volume.
            - name: IRC_ACCOUNTS_PATH
              value: "/var/lib/chonkline/accounts.db"
            # Registered channels (ChanServ) persist alongside accounts.
            - name: IRC_CHANNELS_PATH
              value: "/var/lib/chonkline/channels.db"
            # Deterministic host-cloak key; keeps user IPs private and cloaks
            # stable across restarts so channel bans on a cloak keep working.
            - name: IRC_CLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: chonkline-cloak
                  key: key
            - name: IRC_CLOAK_SUFFIX
              value: "users.chonkbase.net"
            # Client addresses arrive in a PROXY protocol v1 header. Without it
            # every client is cloaked from the ingress pod's own address, so all
            # users share one cloak and no ban, limit or attribution is possible.
            #
            # CUTOVER: "optional" uses a header when present and falls back to
            # the peer address when absent. It is set this way because the
            # ingress does not send the header yet -- ingress-nginx tcp-services
            # needs a SECOND ":PROXY" suffix for that:
            #
            #   "6667": chonkline/chonkline:6667:PROXY:PROXY
            #   "6697": chonkline/chonkline:6697:PROXY:PROXY
            #
            # (the first controls decoding the inbound connection, the second
            # sending upstream to us).
            #
            # Once that is applied and the logs show no "proxy.absent" events,
            # change both values below to "1" to require it. Do not leave this
            # on "optional" longer than the cutover: until the ingress prepends
            # its own header a client can forge one and choose its apparent
            # address. Afterwards a forged line lands after the real one and is
            # parsed harmlessly as an IRC command.
            - name: IRC_PROXY_PROTOCOL
              value: "optional"
            - name: IRC_TLS_PROXY_PROTOCOL
              value: "optional"
            # TLS is terminated in-process so the PROXY header arrives ahead of
            # the handshake and TLS clients get their real address, exactly like
            # plaintext ones. The certificate is the same cert-manager secret the
            # ghostunnel sidecar used to mount.
            - name: IRC_TLS_PORT
              value: "6697"
            - name: IRC_TLS_CERT
              value: "/certs/tls.crt"
            - name: IRC_TLS_KEY
              value: "/certs/tls.key"
            # Admission control.
            #
            # The GLOBAL ceiling is always safe and always on: it does not care
            # whose address a connection came from. During cutover it is the
            # ONLY bound in force, and it is what stops a connect flood from
            # exhausting memory -- which is not hypothetical: the pod was
            # OOMKilled (exit 137) six times on 2026-08-20 before this shipped.
            #
            # Sized against the 256Mi limit below: each connection can hold up
            # to ~128Ki of read buffer plus a rustls session, so 512 tops out
            # near 100Mi and leaves real headroom. Observed legitimate peak
            # outside the flood is single digits.
            - name: IRC_MAX_CLIENTS
              value: "512"
            #
            # The PER-SOURCE bounds (clones, connect rate, message budget) are
            # deliberately NOT set here during cutover. They self-disable while
            # IRC_PROXY_PROTOCOL is not "required", because until the ingress
            # forwards client addresses every user shares the ingress pod's
            # address -- so a per-source cap of 5 would not admit 5 connections
            # per user, it would admit 5 for the entire network.
            #
            # Setting them explicitly would override that interlock and cause
            # exactly that outage. Add them in the same change that flips
            # IRC_PROXY_PROTOCOL to "1", not before:
            #
            #   IRC_MAX_CLONES_PER_IP: "5"
            #   IRC_MAX_CONNECTS_PER_MIN: "30"
            #   IRC_MAX_MESSAGES_PER_10S: "60"
            - name: IRC_MAX_FLOOD_VIOLATIONS
              value: "10"
            # Persistent operator bans (KLINE), alongside the other stores.
            - name: IRC_BANS_PATH
              value: "/var/lib/chonkline/bans.db"
            - name: IRC_LOG_LEVEL
              value: "info"
            - name: IRC_OPER_USER
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: username
            - name: IRC_OPER_PASS
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: password
          ports:
            - name: irc
              containerPort: 6667
            - name: irc-tls
              containerPort: 6697
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/chonkline
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 10
            periodSeconds: 20
          # The sidecar's allocation (20m/16Mi req, 500m/64Mi lim) folds in here
          # now that TLS terminates in-process. The memory limit is raised
          # because rustls holds per-session buffers; with IRC_MAX_CLIENTS=512
          # the worst case tops out near 100Mi, well inside this limit.
          resources:
            requests:
              cpu: 75m
              memory: 64Mi
            limits:
              cpu: "1500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      # fsGroup makes the block volume group-writable by the non-root uid so the
      # account store can be persisted under readOnlyRootFilesystem.
      securityContext:
        fsGroup: 65532
      volumes:
        - name: tls-cert
          secret:
            secretName: chonkline-tls
        - name: data
          persistentVolumeClaim:
            claimName: chonkline-data
