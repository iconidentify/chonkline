apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkline
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chonkline
          image: chonkline
          env:
            - name: IRC_PORT
              value: "6667"
            - name: IRC_SERVER_NAME
              value: "irc.chonkbase.net"
          ports:
            - name: irc
              containerPort: 6667
          readinessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
        # TLS termination for 6697: decrypts with the cert-manager cert and
        # forwards plaintext IRC to the daemon on localhost:6667.
        - name: tls
          image: ghostunnel/ghostunnel:v1.8.2
          args:
            - server
            - --listen=0.0.0.0:6697
            - --target=127.0.0.1:6667
            - --cert=/certs/tls.crt
            - --key=/certs/tls.key
            - --disable-authentication
          ports:
            - name: irc-tls
              containerPort: 6697
          volumeMounts:
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: irc-tls
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: "500m"
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-cert
          secret:
            secretName: chonkline-tls
