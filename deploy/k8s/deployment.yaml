apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkline
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chonkline
          image: chonkline
          env:
            - name: IRC_PORT
              value: "6667"
            - name: IRC_SERVER_NAME
              value: "irc.chonkbase.net"
            # Registered accounts (SASL / NickServ) persist on the block volume.
            - name: IRC_ACCOUNTS_PATH
              value: "/var/lib/chonkline/accounts.db"
            # Registered channels (ChanServ) persist alongside accounts.
            - name: IRC_CHANNELS_PATH
              value: "/var/lib/chonkline/channels.db"
            # Deterministic host-cloak key; keeps user IPs private and cloaks
            # stable across restarts so channel bans on a cloak keep working.
            - name: IRC_CLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: chonkline-cloak
                  key: key
            - name: IRC_CLOAK_SUFFIX
              value: "users.chonkbase.net"
            # Client addresses arrive in a PROXY protocol v1 header from the
            # ingress. Without parsing it every client is cloaked from the
            # ingress pod's own address, so all users share one cloak and no
            # ban, limit, or attribution is possible. Fails closed: a missing or
            # malformed header drops the connection rather than silently
            # falling back and reintroducing the shared cloak.
            - name: IRC_PROXY_PROTOCOL
              value: "1"
            # TLS is terminated in-process so the PROXY header arrives ahead of
            # the handshake and TLS clients get their real address, exactly like
            # plaintext ones. The certificate is the same cert-manager secret the
            # ghostunnel sidecar used to mount.
            - name: IRC_TLS_PORT
              value: "6697"
            - name: IRC_TLS_CERT
              value: "/certs/tls.crt"
            - name: IRC_TLS_KEY
              value: "/certs/tls.key"
            # Admission control. The per-source bounds are only meaningful with
            # real addresses above; they self-disable if PROXY parsing is off,
            # so a shared address can never be capped as though it were one user.
            - name: IRC_MAX_CLONES_PER_IP
              value: "5"
            - name: IRC_MAX_CLIENTS
              value: "1024"
            - name: IRC_MAX_CONNECTS_PER_MIN
              value: "30"
            # Aggregate per-source message budget, above the per-connection
            # burst window, so spreading traffic across connections no longer
            # multiplies the allowance.
            - name: IRC_MAX_MESSAGES_PER_10S
              value: "60"
            - name: IRC_MAX_FLOOD_VIOLATIONS
              value: "10"
            # Persistent operator bans (KLINE), alongside the other stores.
            - name: IRC_BANS_PATH
              value: "/var/lib/chonkline/bans.db"
            - name: IRC_LOG_LEVEL
              value: "info"
            - name: IRC_OPER_USER
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: username
            - name: IRC_OPER_PASS
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: password
          ports:
            - name: irc
              containerPort: 6667
            - name: irc-tls
              containerPort: 6697
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/chonkline
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 10
            periodSeconds: 20
          # The sidecar's allocation (20m/16Mi req, 500m/64Mi lim) folds in here
          # now that TLS terminates in-process. The memory limit is raised
          # because rustls holds per-session buffers: at IRC_MAX_CLIENTS=1024
          # those alone can approach the old 128Mi ceiling.
          resources:
            requests:
              cpu: 75m
              memory: 64Mi
            limits:
              cpu: "1500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      # fsGroup makes the block volume group-writable by the non-root uid so the
      # account store can be persisted under readOnlyRootFilesystem.
      securityContext:
        fsGroup: 65532
      volumes:
        - name: tls-cert
          secret:
            secretName: chonkline-tls
        - name: data
          persistentVolumeClaim:
            claimName: chonkline-data
