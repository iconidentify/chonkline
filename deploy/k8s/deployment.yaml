apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkline
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chonkline
          image: chonkline
          env:
            - name: IRC_PORT
              value: "6667"
            - name: IRC_SERVER_NAME
              value: "irc.chonkbase.net"
            # Registered accounts (SASL / NickServ) persist on the block volume.
            - name: IRC_ACCOUNTS_PATH
              value: "/var/lib/chonkline/accounts.db"
            # Registered channels (ChanServ) persist alongside accounts.
            - name: IRC_CHANNELS_PATH
              value: "/var/lib/chonkline/channels.db"
            # Deterministic host-cloak key; keeps user IPs private and cloaks
            # stable across restarts so channel bans on a cloak keep working.
            - name: IRC_CLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: chonkline-cloak
                  key: key
            - name: IRC_CLOAK_SUFFIX
              value: "users.chonkbase.net"
            - name: IRC_OPER_USER
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: username
            - name: IRC_OPER_PASS
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: password
          ports:
            - name: irc
              containerPort: 6667
          volumeMounts:
            - name: data
              mountPath: /var/lib/chonkline
          readinessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
        # TLS on 6697: terminates TLS with the cert-manager cert, forwards plaintext
        # to the daemon on 6667. (ingress does not send PROXY protocol to this backend.)
        - name: tls
          image: ghostunnel/ghostunnel:v1.8.2
          args:
            - server
            - --listen=0.0.0.0:6697
            - --target=127.0.0.1:6667
            - --cert=/certs/tls.crt
            - --key=/certs/tls.key
            - --disable-authentication
          ports:
            - name: irc-tls
              containerPort: 6697
          volumeMounts:
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: irc-tls
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: "500m"
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      # fsGroup makes the block volume group-writable by the non-root uid so the
      # account store can be persisted under readOnlyRootFilesystem.
      securityContext:
        fsGroup: 65532
      volumes:
        - name: tls-cert
          secret:
            secretName: chonkline-tls
        - name: data
          persistentVolumeClaim:
            claimName: chonkline-data
