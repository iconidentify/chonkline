apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkline
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chonkline
          image: chonkline
          env:
            - name: IRC_PORT
              value: "6667"
            - name: IRC_SERVER_NAME
              value: "irc.chonkbase.net"
            # Registered accounts (SASL / NickServ) persist on the block volume.
            - name: IRC_ACCOUNTS_PATH
              value: "/var/lib/chonkline/accounts.db"
            # Registered channels (ChanServ) persist alongside accounts.
            - name: IRC_CHANNELS_PATH
              value: "/var/lib/chonkline/channels.db"
            # Deterministic host-cloak key; keeps user IPs private and cloaks
            # stable across restarts so channel bans on a cloak keep working.
            - name: IRC_CLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: chonkline-cloak
                  key: key
            - name: IRC_CLOAK_SUFFIX
              value: "users.chonkbase.net"
            # Client addresses arrive in a PROXY protocol v1 header. Without it
            # every client is cloaked from the ingress pod's own address, so all
            # users share one cloak and no ban, limit or attribution is possible.
            #
            # CUTOVER: "optional" uses a header when present and falls back to
            # the peer address when absent. It is set this way because the
            # ingress does not send the header yet -- ingress-nginx tcp-services
            # needs a SECOND ":PROXY" suffix for that:
            #
            #   "6667": chonkline/chonkline:6667:PROXY:PROXY
            #   "6697": chonkline/chonkline:6697:PROXY:PROXY
            #
            # (the first controls decoding the inbound connection, the second
            # sending upstream to us).
            #
            # Once that is applied and the logs show no "proxy.absent" events,
            # change both values below to "1" to require it. Do not leave this
            # on "optional" longer than the cutover: until the ingress prepends
            # its own header a client can forge one and choose its apparent
            # address. Afterwards a forged line lands after the real one and is
            # parsed harmlessly as an IRC command.
            # Now "required": both remaining paths prepend a header -- the
            # dedicated NodeBalancer (PROXY v1, per-port) and, while it is still
            # in place as a fallback, the shared ingress (":PROXY:PROXY"). A
            # forged header from a client therefore lands after the real one and
            # is parsed harmlessly as an IRC command rather than setting the
            # client's apparent address.
            - name: IRC_PROXY_PROTOCOL
              value: "1"
            - name: IRC_TLS_PROXY_PROTOCOL
              value: "1"
            # TLS is terminated in-process so the PROXY header arrives ahead of
            # the handshake and TLS clients get their real address, exactly like
            # plaintext ones. The certificate is the same cert-manager secret the
            # ghostunnel sidecar used to mount.
            - name: IRC_TLS_PORT
              value: "6697"
            - name: IRC_TLS_CERT
              value: "/certs/tls.crt"
            - name: IRC_TLS_KEY
              value: "/certs/tls.key"
            # HTTPS for the web property, sharing the same certificate. Behind
            # the dedicated load balancer there is no ingress left to terminate
            # TLS for irc.chonkbase.net, so the daemon does it.
            - name: IRC_HTTPS_PORT
              value: "8443"
            # Admission control.
            #
            # The GLOBAL ceiling is always safe and always on: it does not care
            # whose address a connection came from. During cutover it is the
            # ONLY bound in force, and it is what stops a connect flood from
            # exhausting memory -- which is not hypothetical: the pod was
            # OOMKilled (exit 137) six times on 2026-08-20 before this shipped.
            #
            # Sized against the 256Mi limit below: each connection can hold up
            # to ~128Ki of read buffer plus a rustls session, so 512 tops out
            # near 100Mi and leaves real headroom. Observed legitimate peak
            # outside the flood is single digits.
            - name: IRC_MAX_CLIENTS
              value: "512"
            #
            # The PER-SOURCE bounds (clones, connect rate, message budget) are
            # deliberately NOT set here during cutover. They self-disable while
            # IRC_PROXY_PROTOCOL is not "required", because until the ingress
            # forwards client addresses every user shares the ingress pod's
            # address -- so a per-source cap of 5 would not admit 5 connections
            # per user, it would admit 5 for the entire network.
            #
            # PER-SOURCE bounds. Safe to set now that clients arrive via the
            # dedicated balancer with their real addresses (PROXY v1).
            - name: IRC_MAX_CLONES_PER_IP
              value: "5"
            - name: IRC_MAX_CONNECTS_PER_MIN
              value: "30"
            - name: IRC_MAX_MESSAGES_PER_10S
              value: "60"
            # Infrastructure is exempt from all of the above. Health checks from
            # the balancer and cluster gateways arrive far faster than 30/min
            # from a handful of shared addresses, and were being refused ~40
            # times a minute before this was set. Patterns rather than exact IPs:
            # these addresses change whenever the balancer or gateway is
            # recreated, and a lapsed exemption would start refusing traffic
            # silently. Exempt sources are also kept out of IRC_MAX_CLIENTS, so
            # a health-check cadence can never consume the global ceiling.
            # NARROWED. This previously included 10.2.* and the node addresses,
            # which are exactly what the legacy ingress path SNAT'd to -- so any
            # client reaching 6667/6697 through the old ingress was exempt from
            # every limit AND from the global ceiling, making it an unbounded
            # connection sink into a pod that OOMs in under a minute. That path
            # is now removed; only the NodeBalancer's own health-check address
            # needs exempting.
            - name: IRC_LIMIT_EXEMPT
              value: "192.168.*,127.0.0.1"
            # Peers whose PROXY header is trusted.
            #
            # A header is only as trustworthy as the path it arrived on. A
            # type: LoadBalancer Service also opens a NodePort on EVERY node's
            # public address, so the balancer can be bypassed by anyone who
            # scans for it -- and a bypasser writes their own header, naming any
            # source they like. Verified against production: a direct NodePort
            # connection registered as an arbitrary address, and by naming one
            # inside IRC_LIMIT_EXEMPT it became exempt from every bound.
            #
            # Set this to the address the balancer actually reaches the pod
            # from; the value appears as `peer=` on conn.open at DEBUG. This is
            # necessary but NOT sufficient on its own -- restrict the NodePort
            # range at the firewall as well, because an attacker that can still
            # reach the port can claim any non-exempt address to evade bans.
            - name: IRC_PROXY_TRUSTED
              value: ""
            - name: IRC_MAX_FLOOD_VIOLATIONS
              value: "10"
            # Persistent operator bans (KLINE), alongside the other stores.
            - name: IRC_BANS_PATH
              value: "/var/lib/chonkline/bans.db"
            - name: IRC_LOG_LEVEL
              value: "info"
            #
            # SERVER LINKING. Off unless IRC_SID is set, and an unlinked
            # deployment behaves exactly as before. To join a network:
            #
            #   IRC_SID                 our server id, [0-9][A-Z0-9]{2}
            #   IRC_LINK_PORT           listen for inbound links
            #   IRC_LINK_PEERS          host:port:fingerprint, comma separated
            #   IRC_LINK_PASSWORD       shared with the peer's <link> block
            #   IRC_LINK_TLS            "1" -- see below
            #
            # Set IRC_LINK_TLS=1 for anything that is not loopback. A link
            # carries every user's traffic and the link password in the clear
            # otherwise. Certificates on server links are routinely self-signed,
            # so peers are authenticated by pinning a SHA-256 certificate
            # fingerprint rather than by a CA chain: an outbound peer without a
            # pin is refused, because an unauthenticated TLS link is encrypted
            # against an observer and wide open to whoever answers the address.
            #
            # The pod logs its own fingerprint as link.fingerprint at startup;
            # that is the value the other operator needs.
            #
            # - name: IRC_SID
            #   value: "0CL"
            # - name: IRC_LINK_PORT
            #   value: "7001"
            # - name: IRC_LINK_TLS
            #   value: "1"
            # - name: IRC_LINK_PEERS
            #   value: "hub.example.net:7001:<their sha256 fingerprint>"
            # - name: IRC_LINK_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: chonkline-link
            #       key: password
            - name: IRC_OPER_USER
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: username
            - name: IRC_OPER_PASS
              valueFrom:
                secretKeyRef:
                  name: chonkline-oper
                  key: password
          ports:
            - name: irc
              containerPort: 6667
            - name: irc-tls
              containerPort: 6697
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: data
              mountPath: /var/lib/chonkline
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 2
            periodSeconds: 10
          # Liveness is deliberately slack. The probe targets the very port a
          # connect flood contends for, and recovery costs ~90s (Recreate plus a
          # block-volume detach/reattach) -- so a tight probe turns an attack
          # into a self-amplifying restart loop. With one replica a restart can
          # never fail over to anything, so it only ever subtracts availability.
          livenessProbe:
            tcpSocket:
              port: irc
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          # The sidecar's allocation (20m/16Mi req, 500m/64Mi lim) folds in here
          # now that TLS terminates in-process. The memory limit is raised
          # because rustls holds per-session buffers; with IRC_MAX_CLIENTS=512
          # the worst case tops out near 100Mi, well inside this limit.
          resources:
            requests:
              cpu: 75m
              memory: 64Mi
            limits:
              # 500m, not 1500m: the node has 2 cores and also runs coredns and
              # chonkbase-postgres. Under flood we want chonkline throttled, not
              # starving cluster DNS. Steady state is ~2m, so this is still ~250x
              # headroom. Memory stays deliberately low -- it makes chonkline
              # fail fast and alone rather than dragging the node down.
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      # fsGroup makes the block volume group-writable by the non-root uid so the
      # account store can be persisted under readOnlyRootFilesystem.
      securityContext:
        fsGroup: 65532
      volumes:
        - name: tls-cert
          secret:
            secretName: chonkline-tls
        - name: data
          persistentVolumeClaim:
            claimName: chonkline-data
