apiVersion: v1
kind: Service
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  selector:
    app.kubernetes.io/name: chonkline
  ports:
    - name: irc
      port: 6667
      targetPort: irc
    - name: irc-tls
      port: 6697
      targetPort: irc-tls
    - name: http
      port: 8080
      targetPort: http
  # 6667 = plaintext IRC. 6697 = TLS (ghostunnel sidecar). 8080 = read-only web
  # property (status page + stats/release-notes API); the existing ingress routes
  # irc.chonkbase.net/ to this port with TLS via the chonkline-tls cert.
