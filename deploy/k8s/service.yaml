apiVersion: v1
kind: Service
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  selector:
    app.kubernetes.io/name: chonkline
  ports:
    - name: irc
      port: 6667
      targetPort: irc
  # TLS (6697) and the web/HTTP interface (8080) are intentionally retired in
  # the Rust rewrite. Non-TLS 6667 only for the initial launch.
