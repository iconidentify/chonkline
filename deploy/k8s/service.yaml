apiVersion: v1
kind: Service
metadata:
  name: chonkline
  namespace: chonkline
  labels:
    app.kubernetes.io/name: chonkline
spec:
  selector:
    app.kubernetes.io/name: chonkline
  ports:
    - name: irc
      port: 6667
      targetPort: irc
    - name: irc-tls
      port: 6697
      targetPort: irc-tls
  # 6667 = plaintext IRC (rustircd). 6697 = TLS, terminated by the ghostunnel
  # sidecar using the cert-manager chonkline-tls cert, forwarded to 6667.
