<server name="insp.test"
        description="InspIRCd Link Test"
        id="1IN"
        network="LinkTest">

<admin name="Test" nick="test" email="test@example.invalid">

<bind address="127.0.0.1" port="7000" type="clients">
<bind address="127.0.0.1" port="7001" type="servers">

<class name="Default"
       commandrate="1000"
       fakelag="off"
       pingfreq="60"
       recvq="16384"
       sendq="1048576"
       localmax="100"
       globalmax="100">

<connect name="main" allow="*" class="Default">

<files motd="motd.txt">

<options prefixquit="Quit: " casemapping="ascii">

<security hidewhois="" userstats="Pu">

<log method="file" type="* -USERINPUT -USEROUTPUT" level="debug" target="logs/ircd.log">

<module name="spanningtree">

<link name="chonk.test"
      ipaddr="127.0.0.1"
      port="7001"
      allowmask="127.0.0.1/32"
      sendpass="linkpass"
      recvpass="linkpass"
      hidden="no">
