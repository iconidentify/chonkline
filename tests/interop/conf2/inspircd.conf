<server name="insp2.test"
        description="InspIRCd Link Test"
        id="3IN"
        network="LinkTest">

<admin name="Test" nick="test" email="test@example.invalid">

<bind address="127.0.0.1" port="7020" type="clients">
<bind address="127.0.0.1" port="7021" type="servers">

# Connection limits live on <connect> itself; <class> is for OPER classes, so
# putting them there left this on InspIRCd's defaults (a handful of connections
# per IP) and every stress client after the first was reset.
<connect name="main"
         allow="*"
         resolvehostnames="no"
         timeout="10"
         pingfreq="120"
         sendq="1048576"
         recvq="65536"
         localmax="1000"
         globalmax="1000"
         commandrate="10000"
         fakelag="no"
         threshold="100">

<files motd="motd.txt">

<options prefixquit="Quit: " casemapping="ascii">

<security hidewhois="" userstats="Pu">

<log method="file" type="* -USERINPUT -USEROUTPUT" level="debug" target="logs/ircd.log">

<module name="spanningtree">

<link name="insp.test"
      ipaddr="127.0.0.1"
      port="7001"
      allowmask="127.0.0.1/32"
      sendpass="linkpass"
      recvpass="linkpass"
      hidden="no">
